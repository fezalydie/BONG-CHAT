# BONG CHAT — nginx reverse proxy in front of the Node server.
#
# The app server already serves the built client, the API, uploads and
# Socket.IO on one port, so nginx only needs to terminate TLS and forward.
#
# Place at /etc/nginx/sites-available/bong-chat and symlink into sites-enabled.
# Replace example.com with your domain, then run `certbot --nginx` for certs.

# Redirect all plain HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com;

    # Certificates issued by certbot (Let's Encrypt).
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # Allow reasonably large photo/video uploads (MAX_VIDEO_MB on the server).
    client_max_body_size 60m;

    # Long-lived cache for Vite's content-hashed assets; everything else is
    # served fresh so new deploys are picked up immediately.
    location /assets/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Socket.IO — needs a WebSocket upgrade and a long read timeout.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    # API, uploads and the SPA all go to the same upstream.
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
